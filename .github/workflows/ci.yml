name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: python -m py_compile batcher.py

      - name: Logic tests (no network)
        run: python tests/test_logic.py

      - name: Benchmark artifacts present
        run: |
          test -f benchmarks/2026-09-16-light-escalation.md
          test -f benchmarks/batcher_2026-09-16_223432.json
